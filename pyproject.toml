[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-eyes"
version = "1.0.0"
description = "MCP server that provides image description using StepFun Step-3.7-flash multimodal model. Gives vision to models without multimodal ability."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["Pillow>=9.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
